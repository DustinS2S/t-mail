[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t-mail"
version = "0.1.0"
description = "Lightweight, zero-dependency CLI email client for terminal and Termux."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Dustin", email = "DustinS2S@users.noreply.github.com"}
]
keywords = ["email", "cli", "terminal", "termux", "smtp", "mail", "lightweight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DustinS2S/t-mail"
Repository = "https://github.com/DustinS2S/t-mail"
Issues = "https://github.com/DustinS2S/t-mail/issues"

[project.scripts]
tmail = "tmail.cli:main"
t-mail = "tmail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
